<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/default.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Oscar Walczak's Outstanding Woodpecker | ITIS3135 | Survey Form</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html" data-replace="%page%:Survey Form"></div>
    <main class="main">
        <h2>Survey Form</h2>
        <p>Help Ozzie plan the next Woodpecker Field Station walk. This demo does not send or store your response.</p>
        <form>
            <label for="visitor-name">Your name
                <input id="visitor-name" name="visitor-name" type="text" autocomplete="name" required>
            </label>
            <label for="visitor-email">Email address
                <input id="visitor-email" name="visitor-email" type="email" autocomplete="email" required>
            </label>
            <label for="favorite-find">Which woodland neighbor would you most like to spot?
                <select id="favorite-find" name="favorite-find" required>
                    <option value="">Choose one</option>
                    <option value="woodpecker">Woodpecker</option>
                    <option value="toad">Toad</option>
                    <option value="salamander">Salamander</option>
                    <option value="turtle">Turtle</option>
                    <option value="snail">Snail</option>
                </select>
            </label>
            <fieldset>
                <legend>What would you like to do on the walk?</legend>
                <label><input name="walk-activity" type="radio" value="birdwatching" required> Watch for birds</label>
                <label><input name="walk-activity" type="radio" value="field-notes"> Keep field notes</label>
                <label><input name="walk-activity" type="radio" value="trail-care"> Help care for the trail</label>
            </fieldset>
            <button type="submit">Preview My Response</button>
            <output aria-live="polite"></output>
        </form>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
    <script src="scripts/field-station-survey.js"></script>
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
</body>
</html>
