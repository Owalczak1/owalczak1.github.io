<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/default.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Oscar Walczak's Outstanding Woodpecker | ITIS3135 | Survey Form</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html" data-replace="%page%:Survey"></div>
    <main class="main">
        <h2>Survey Form</h2>
        <hr>
        <form>
            <label for="visitor-name">Name</label>
            <input id="visitor-name" name="name" type="text" placeholder="Your name">
            <label for="visitor-email">Email</label>
            <input id="visitor-email" name="email" type="email" placeholder="you@example.com">
            <label for="visit-reason">What brought you here?</label>
            <input id="visit-reason" name="reason" type="text" placeholder="Tell us what you are exploring">
            <button type="submit">Submit Survey</button>
        </form>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
</body>
</html>
