<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title description">
    <title id="title">Sample pop-up schedule</title>
    <desc id="description">A weekly calendar marks Wednesday and Saturday as sample booth days.</desc>
    <rect width="720" height="420" rx="28" fill="#e9ddc5"/>
    <rect x="120" y="70" width="480" height="280" rx="20" fill="#fff8e9" stroke="#173c32" stroke-width="8"/>
    <path d="M120 135h480M215 70v280M310 135v215M405 135v215M500 135v215" stroke="#173c32" stroke-width="5"/>
    <path d="M166 55v40m390-40v40" stroke="#a4472e" stroke-width="12" stroke-linecap="round"/>
    <g fill="#173c32" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
        <text x="167" y="118">W</text><text x="263" y="118">T</text><text x="358" y="118">W</text>
        <text x="453" y="118">T</text><text x="548" y="118">S</text>
    </g>
    <rect x="324" y="165" width="67" height="62" rx="12" fill="#f0c86c"/>
    <rect x="514" y="260" width="67" height="62" rx="12" fill="#a4472e"/>
    <text x="358" y="205" fill="#173c32" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">11–2</text>
    <text x="548" y="300" fill="#fff8e9" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">10–1</text>
</svg>
