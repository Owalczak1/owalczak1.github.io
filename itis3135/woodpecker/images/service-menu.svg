<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title description">
    <title id="title">Woodpecker service menu</title>
    <desc id="description">Three cards represent scripts, shortcuts, and mini-tools.</desc>
    <rect width="720" height="420" rx="28" fill="#e9ddc5"/>
    <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
        <rect x="60" y="90" width="180" height="230" rx="18" fill="#fff8e9" stroke="#173c32" stroke-width="8"/>
        <path d="m105 155 26 24-26 24m39 0h46" fill="none" stroke="#a4472e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="150" y="270" fill="#173c32" font-size="21">SCRIPT</text>
        <rect x="270" y="90" width="180" height="230" rx="18" fill="#245847" stroke="#173c32" stroke-width="8"/>
        <rect x="306" y="143" width="108" height="68" rx="12" fill="#fff8e9"/>
        <text x="360" y="188" fill="#173c32" font-size="26">⌘ K</text>
