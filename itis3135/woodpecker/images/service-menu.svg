        <rect x="522" y="138" width="96" height="76" rx="8" fill="#f0c86c" stroke="#173c32" stroke-width="7"/>
        <path d="M539 161h61m-61 23h41m-41 22h52" stroke="#173c32" stroke-width="7" stroke-linecap="round"/>
        <text x="570" y="270" fill="#173c32" font-size="19">MINI-TOOL</text>
