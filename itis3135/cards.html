<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/default.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Oscar Walczak's Outstanding Woodpecker | ITIS3135 | Page of Playing Cards</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html" data-replace="%page%:Page of Playing Cards"></div>
    <main class="main">
        <h2>Page of Playing Cards</h2>
        <p>Meet a few of the woodland neighbors that share Ozzie's field station trail.</p>
        <!-- This grid keeps the six wildlife field cards aligned and responsive. -->
        <div class="card-grid">
            <figure>
                <img src="images/woodland-toad-side-profile.jpg" alt="A toad resting on a rough trail surface" width="1280" height="591">
                <figcaption>Trailside Toad</figcaption>
            </figure>
            <figure>
                <img src="images/woodland-toad-front-view.jpg" alt="A toad facing forward on the trail" width="1280" height="720">
                <figcaption>Watchful Toad</figcaption>
            </figure>
            <figure>
                <img src="images/woodland-toad-perched.jpg" alt="A toad sitting low on the ground" width="1280" height="720">
                <figcaption>Ground Keeper</figcaption>
            </figure>
            <figure>
                <img src="images/salamander-on-trail.jpg" alt="A dark salamander crossing a rocky path" width="1280" height="721">
                <figcaption>Night Walker</figcaption>
            </figure>
            <figure>
                <img src="images/snail-on-path.jpg" alt="A small snail moving across a path" width="1280" height="721">
                <figcaption>Slow-and-Steady Scout</figcaption>
            </figure>
            <figure>
                <img src="images/turtle-crossing-trail.jpg" alt="A turtle crossing a paved trail beside grass" width="1280" height="721">
                <figcaption>Trail Crosser</figcaption>
            </figure>
        </div>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
</body>
</html>
